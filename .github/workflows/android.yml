name: Gerar APK MomCare
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verificar cálculos
        run: node tests/core.test.js
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar navegador de teste
        run: |
          npm install --no-save playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Testar interface mobile
        run: node tests/mobile.cjs
      - name: Instalar SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: momcare-debug-signing-v1
      - name: Compilar APK
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - name: Verificar conteúdo do APK
        run: |
          python3 - <<'PYCODE'
          import zipfile
          with zipfile.ZipFile('android/app/build/outputs/apk/debug/app-debug.apk') as apk:
              for name in ['assets/index.html', 'assets/style.css', 'assets/core.js', 'assets/script.js', 'classes.dex', 'AndroidManifest.xml']:
                  assert len(apk.read(name)) > 0, name
              assert apk.testzip() is None
          PYCODE
      - uses: actions/upload-artifact@v4
        with:
          name: MomCare-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
